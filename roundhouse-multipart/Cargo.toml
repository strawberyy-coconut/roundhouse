[package]
name = "roundhouse-multipart"
version = "0.2.0"
edition.workspace = true
description = "Typed multipart extraction for roundhouse."
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# `TempFile` fields, streamed to an already-unlinked temporary file.
multipart-tempfile = ["dep:tempfile"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["multipart"] }
bytes = "1"
roundhouse-problem = { path = "../roundhouse-problem", version = "0.2.0" }
roundhouse-schema = { path = "../roundhouse-schema", version = "0.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = { version = "3", optional = true }
utoipa = { version = "6", features = ["non_strict_integers"] }
