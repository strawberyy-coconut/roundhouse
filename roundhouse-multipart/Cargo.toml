[package]
name = "roundhouse-multipart"
version = "0.2.0"
edition = "2024"
description = "Typed multipart extraction for roundhouse."
license = "MIT OR Apache-2.0"
repository = "https://github.com/roundhouse/roundhouse"
rust-version = "1.85"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
bytes = "1"
roundhouse-schema = { path = "../roundhouse-schema" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
utoipa = { version = "6", features = ["non_strict_integers"] }
