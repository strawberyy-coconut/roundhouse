[package]
name = "roundhouse-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The `cargo roundhouse` command for build-time contract generation."

[[bin]]
name = "cargo-roundhouse"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
roundhouse-build = { path = "../roundhouse-build", version = "0.4.6" }
serde_json = "1"
toml_edit = "0.22"
