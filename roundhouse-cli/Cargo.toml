[package]
name = "roundhouse-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Build-time contract generation for roundhouse."

[lib]
name = "roundhouse_cli"
path = "src/lib.rs"

[[bin]]
name = "cargo-roundhouse"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The binary's argument parsing and `init`'s manifest editing. A `build.rs` build-dependency can
# disable this to compile only the generator.
cli = ["dep:clap", "dep:toml_edit"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
serde_json = "1"
toml_edit = { version = "0.22", optional = true }
