[package]
name = "roundhouse-problem"
version = "0.2.0"
edition = "2024"
description = "The RFC 9457 problem response shared by roundhouse and its satellites."
license = "MIT OR Apache-2.0"
repository = "https://github.com/axum-roundhouse/axum-roundhouse"
rust-version = "1.88"

[dependencies]
axum = "0.8"
http = "1"
roundhouse-schema = { path = "../roundhouse-schema" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
