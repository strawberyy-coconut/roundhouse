[package]
name = "roundhouse-problem"
version = "0.2.0"
edition.workspace = true
description = "The RFC 9457 problem response shared by roundhouse and its satellites."
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
axum = { version = "0.8", default-features = false }
http = "1"
roundhouse-schema = { path = "../roundhouse-schema", version = "0.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
