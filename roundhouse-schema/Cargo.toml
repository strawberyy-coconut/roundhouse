[package]
name = "roundhouse-schema"
version = "0.2.0"
edition = "2024"
description = "Schema derivation, constraints and validation for roundhouse."
license = "MIT OR Apache-2.0"
repository = "https://github.com/roundhouse/roundhouse"
rust-version = "1.85"

[dependencies]
bytes = "1"
chrono = { version = "0.4", optional = true, default-features = false }
jiff = { version = "0.2", optional = true, features = ["serde"] }
jsonschema = { version = "0.60", default-features = false }
regex = "1"
rust_decimal = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", optional = true }
utoipa = { version = "6", features = ["non_strict_integers"] }
uuid = { version = "1", optional = true }

[features]
default = []
uuid = ["dep:uuid"]
chrono = ["dep:chrono"]
time = ["dep:time"]
decimal = ["dep:rust_decimal"]
jiff = ["dep:jiff"]
