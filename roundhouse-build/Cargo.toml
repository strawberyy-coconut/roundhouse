[package]
name = "roundhouse-build"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Build-time contract generation for roundhouse."

[lib]
name = "roundhouse_build"
path = "src/lib.rs"

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
roundhouse-schema = { path = "../roundhouse-schema", version = "0.4.7" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "extra-traits", "parsing", "visit"] }
