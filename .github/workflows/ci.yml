name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Optional features must compose without pulling in unrelated crates. The macros are always
      # present; these checks cover the runtime capability surface.
      - run: cargo check -p roundhouse --no-default-features
      - run: cargo check -p roundhouse --no-default-features --features schema-engine
      - run: cargo check -p roundhouse --no-default-features --features serve
      - run: cargo check -p roundhouse --no-default-features --features multipart
      - run: cargo check -p roundhouse --no-default-features --features contract-runtime
      - run: cargo check -p roundhouse --no-default-features --features contract
      - run: cargo check -p roundhouse --no-default-features --features multipart,contract
      # `build.rs` users depend on the library with `default-features = false`, so the generator
      # must compile without the CLI parser or manifest editing.
      - run: cargo check -p roundhouse-cli --no-default-features
      # The committed contract bins and artifacts must match the handlers. This is the CI gate the
      # build-time workflow is designed around.
      - run: cargo build -p roundhouse-cli --bin cargo-roundhouse
      - run: |
          export PATH="$PWD/target/debug:$PATH"
          for example in notes layers uploads auth quickstart; do
            (cd "examples/$example" && cargo roundhouse check)
          done
      # The production fixture is built without the contract feature: its graph must not contain
      # utoipa or the optional multipart body crates, and the runtime must still compile routes
      # and handlers.
      - run: "! cargo tree -p production-fixture -e normal | grep -iE 'utoipa|multer|tempfile'"
      # The examples consume committed contracts through `contract-runtime`; only their dev
      # builds enable the document builder.
      - run: |
          for package in notes-example layers-example uploads-example auth-example quickstart-example; do
            if cargo tree -p "$package" -e normal | grep -i utoipa; then
              echo "$package pulls utoipa into its production build" >&2
              exit 1
            fi
          done
      - run: cargo test --workspace --all-features
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      # The declared `rust-version` must actually compile, including the macros that use
      # let-chains.
      - run: cargo test --workspace --all-features --no-run
