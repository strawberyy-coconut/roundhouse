[package]
name = "uploads-example"
version = "0.1.0"
edition = "2024"
publish = false
description = "Multipart uploads, temp files, attachments, raw files, SSE, docs UI and max-body limits."

[dependencies]
axum = "0.8"
futures-util = "0.3"
roundhouse = { path = "../.." }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http = "1"
http-body-util = "0.1"
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
