[package]
name = "auth-example"
version = "0.1.0"
edition = "2024"
publish = false
description = "Auth<A> extractors, scopes, optional auth, two-scheme AND requirements and the security registry."

[dependencies]
axum = "0.8"
roundhouse = { path = "../.." }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http = "1"
http-body-util = "0.1"
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
