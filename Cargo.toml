[workspace]
members = [
    "roundhouse-macros",
    "roundhouse-macros-core",
    "roundhouse-path",
    "roundhouse-problem",
    "roundhouse-schema",
    "roundhouse-multipart",
    "examples/notes",
    "examples/layers",
    "examples/uploads",
    "examples/auth",
    "tests/fixtures/renamed",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/strawberyy-coconut/roundhouse"
rust-version = "1.88"

[package]
name = "roundhouse"
version.workspace = true
edition.workspace = true
description = "An OpenAPI-first axum framework: declarations in, router and document out."
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["axum", "openapi", "web", "framework", "router"]
categories = ["web-programming::http-server"]

[features]
default = ["schema-engine", "serve", "swagger"]
# Typed multipart extraction, plus axum's multipart body support.
multipart = ["dep:roundhouse-multipart", "axum/multipart"]
# `TempFile` parts, streamed to an already-unlinked temporary file.
multipart-tempfile = ["multipart", "roundhouse-multipart/multipart-tempfile"]
# Execute the emitted JSON Schema for request/response validation (default).
schema-engine = ["roundhouse-schema/schema-engine", "dep:regex"]
# `App::serve` and `App::serve_with`, plus the tokio server runtime and its log line.
serve = ["axum/http1", "axum/tokio", "dep:tokio", "dep:tracing"]
# Serve the vendored Swagger UI assets with `App::docs()` (local by default) and
# `App::swagger()`. Disable this feature to keep the binary small and use the unpkg UI.
swagger = []
uuid = ["roundhouse-schema/uuid"]
chrono = ["roundhouse-schema/chrono"]
time = ["roundhouse-schema/time"]
decimal = ["roundhouse-schema/decimal"]
jiff = ["roundhouse-schema/jiff"]

[dependencies]
axum = { version = "0.8", default-features = false, features = [
    "form",
    "json",
    "matched-path",
    "original-uri",
    "query",
] }
bytes = "1"
http = "1"
matchit = "0.8"
regex = { version = "1", optional = true }
roundhouse-macros = { path = "roundhouse-macros", version = "0.3.0" }
roundhouse-multipart = { path = "roundhouse-multipart", version = "0.3.0", optional = true }
roundhouse-path = { path = "roundhouse-path", version = "0.3.0" }
roundhouse-problem = { path = "roundhouse-problem", version = "0.3.0" }
roundhouse-schema = { path = "roundhouse-schema", version = "0.3.0" }
serde = { version = "1", features = ["derive"] }
serde_html_form = "0.2"
serde_json = "1"
tokio = { version = "1", features = ["net", "rt"], optional = true }
tracing = { version = "0.1", optional = true, default-features = false, features = ["std"] }
tower = { version = "0.5", features = ["util"] }
utoipa = { version = "6", features = ["non_strict_integers"] }

[dev-dependencies]
futures-util = "0.3"
http-body-util = "0.1"
jiff = { version = "0.2", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
trybuild = "1"
uuid = { version = "1", features = ["serde"] }

[[test]]
name = "files"
path = "tests/files.rs"
required-features = ["multipart", "multipart-tempfile"]

[[test]]
name = "swagger"
path = "tests/swagger.rs"
required-features = ["swagger"]

[package.metadata.docs.rs]
all-features = true
