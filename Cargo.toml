[workspace]
members = [
    "roundhouse-cli",
    "roundhouse-macros",
    "roundhouse-schema",
    "roundhouse-multipart",
    "examples/notes",
    "examples/blog",
    "examples/layers",
    "examples/validation",
    "examples/uploads",
    "examples/showcase",
    "examples/auth",
    "examples/renamed",
]
resolver = "2"

[package]
name = "roundhouse"
version = "0.2.0"
edition = "2024"
description = "An OpenAPI-first axum framework: declarations in, router and document out."
license = "MIT OR Apache-2.0"
repository = "https://github.com/axum-roundhouse/axum-roundhouse"
rust-version = "1.88"
keywords = ["axum", "openapi", "web", "framework", "router"]
categories = ["web-programming::http-server"]

[features]
default = ["macros"]
macros = ["dep:roundhouse-macros"]
# Execute the emitted JSON Schema (`Validation::Schema`, `validate_responses()`).
schema-engine = ["roundhouse-schema/schema-engine"]
uuid = ["roundhouse-schema/uuid"]
chrono = ["roundhouse-schema/chrono"]
time = ["roundhouse-schema/time"]
decimal = ["roundhouse-schema/decimal"]
jiff = ["roundhouse-schema/jiff", "dep:jiff"]

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
async-trait = "0.1"
bytes = "1"
http = "1"
jiff = { version = "0.2", optional = true, features = ["serde"] }
inventory = "0.3"
regex = "1"
roundhouse-macros = { path = "roundhouse-macros", optional = true }
roundhouse-multipart = { path = "roundhouse-multipart" }
roundhouse-schema = { path = "roundhouse-schema" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt"] }
tracing = "0.1"
tower = { version = "0.5", features = ["util"] }
utoipa = { version = "6", features = ["non_strict_integers"] }

[dev-dependencies]
futures-util = "0.3"
http-body-util = "0.1"
thiserror = "2"
tower = { version = "0.5", features = ["util"] }
trybuild = "1"
