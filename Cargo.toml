[workspace]
members = [
    "roundhouse-macros",
    "roundhouse-problem",
    "roundhouse-schema",
    "roundhouse-multipart",
    "examples/notes",
    "examples/blog",
    "examples/layers",
    "examples/validation",
    "examples/uploads",
    "examples/showcase",
    "examples/auth",
    "examples/renamed",
]
resolver = "2"

[package]
name = "roundhouse"
version = "0.2.1"
edition = "2024"
description = "An OpenAPI-first axum framework: declarations in, router and document out."
license = "MIT OR Apache-2.0"
repository = "https://github.com/strawberyy-coconut/roundhouse"
rust-version = "1.88"
keywords = ["axum", "openapi", "web", "framework", "router"]
categories = ["web-programming::http-server"]

[features]
default = ["macros", "schema-engine"]
macros = ["dep:roundhouse-macros"]
# Typed multipart extraction, plus axum's multipart body support.
multipart = ["dep:roundhouse-multipart", "axum/multipart"]
# `TempFile` parts, streamed to an already-unlinked temporary file.
multipart-tempfile = ["multipart", "roundhouse-multipart/multipart-tempfile"]
# Execute the emitted JSON Schema for request/response validation (default).
schema-engine = ["roundhouse-schema/schema-engine"]
uuid = ["roundhouse-schema/uuid"]
chrono = ["roundhouse-schema/chrono"]
time = ["roundhouse-schema/time"]
decimal = ["roundhouse-schema/decimal"]
jiff = ["roundhouse-schema/jiff", "dep:jiff"]

[dependencies]
axum = "0.8"
bytes = "1"
http = "1"
jiff = { version = "0.2", optional = true, features = ["serde"] }
matchit = "0.8"
regex = "1"
roundhouse-macros = { path = "roundhouse-macros", version = "0.2.1", optional = true }
roundhouse-multipart = { path = "roundhouse-multipart", version = "0.2.0", optional = true }
roundhouse-problem = { path = "roundhouse-problem", version = "0.2.0" }
roundhouse-schema = { path = "roundhouse-schema", version = "0.2.1" }
serde = { version = "1", features = ["derive"] }
serde_html_form = "0.2"
serde_json = "1"
tokio = { version = "1", features = ["net", "rt"] }
tracing = "0.1"
tower = { version = "0.5", features = ["util"] }
utoipa = { version = "6", features = ["non_strict_integers"] }

[dev-dependencies]
futures-util = "0.3"
http-body-util = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
trybuild = "1"
uuid = { version = "1", features = ["serde"] }

[[test]]
name = "files"
path = "tests/files.rs"
required-features = ["multipart", "multipart-tempfile"]

[package.metadata.docs.rs]
all-features = true
